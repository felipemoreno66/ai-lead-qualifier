name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Agent (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  security:
    name: Security (secrets, n8n export check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: n8n workflows contain no credentials or execution data
        run: python3 scripts/sanitize_n8n.py --check n8n/workflows

  contracts:
    name: Contracts (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/agent
      - run: uv run python -m lead_qualifier.scripts.export_schemas
        working-directory: apps/agent
      - run: pnpm --filter contracts generate
      - name: Generated TypeScript compiles
        run: pnpm --filter contracts typecheck
      - name: Generated contracts are up to date
        run: git diff --exit-code -- packages/contracts

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the stack (inline orchestrator, no API keys)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait
      - name: Seed the demo workspace
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm agent python -m lead_qualifier.scripts.seed
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=200
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pip-audit
        continue-on-error: true
        working-directory: apps/agent
        run: |
          uv export --frozen --no-dev --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
      - name: pnpm audit (production dependencies)
        continue-on-error: true
        run: pnpm audit --prod
