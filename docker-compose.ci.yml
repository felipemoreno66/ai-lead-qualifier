# CI overrides: inline orchestration, relaxed rate limits for the e2e suite. No API keys needed.
services:
  agent:
    environment:
      ORCHESTRATOR: inline
      RATE_IP_PER_MINUTE: "1000"
      RATE_IP_PER_HOUR: "10000"
      RATE_WORKSPACE_PER_HOUR: "10000"
      RATE_EMAIL_PER_DAY: "1000"
      # Hashed bag-of-words embeddings: no model download in CI; the low threshold suits them.
      EMBEDDINGS_PROVIDER: fake
      KB_MIN_SIMILARITY: "0.1"
